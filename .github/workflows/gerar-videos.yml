name: Pipeline Diário Afiliado

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      qtd:
        description: 'Quantidade de vídeos (3 a 5)'
        required: false
        default: '3'
      testar:
        description: 'Só validar credencial da Shopee'
        type: boolean
        default: false
      stats:
        description: 'Só diagnosticar catálogo (grades de corte)'
        type: boolean
        default: false
      seco:
        description: 'Só inspecionar os escolhidos (não grava)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pipeline-afiliado
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testar credencial Shopee
        if: ${{ inputs.testar == true }}
        run: python src/minerador.py --testar
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}

      - name: Calibrar catálogo
        if: ${{ inputs.stats == true }}
        run: python src/minerador.py --stats
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}

      - name: Inspecionar escolhidos
        if: ${{ inputs.seco == true }}
        run: python src/minerador.py --seco
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}

      - name: Instalar ffmpeg
        if: ${{ inputs.testar != true && inputs.stats != true && inputs.seco != true }}
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 1. Minerar oportunidades
        if: ${{ inputs.testar != true && inputs.stats != true && inputs.seco != true }}
        run: python src/minerador.py --qtd ${{ inputs.qtd || '3' }}
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}

      - name: 2. Gerar e enviar vídeos
        if: ${{ inputs.testar != true && inputs.stats != true && inputs.seco != true }}
        run: python src/main.py --limite ${{ inputs.qtd || '3' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: 3. Commitar produtos e histórico
        if: ${{ success() && inputs.testar != true && inputs.stats != true && inputs.seco != true }}
        run: |
          git config user.name "Afiliado Bot"
          git config user.email "bot@users.noreply.github.com"
          git add produtos.json historico.json
          if git diff --staged --quiet; then
            echo "Sem alteracoes para commitar."
          else
            git commit -m "Minerados: $(date -u '+%d/%m/%Y %H:%M UTC')"
            git push
          fi
